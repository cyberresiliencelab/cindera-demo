name: Build & Publish Cindera DEMO (public sample)

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC
    - cron: "0 18 * * *"     # 18:00 UTC
  workflow_dispatch:          # "Run workflow" button for an instant rebuild
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build encrypted page
        env:
          # Filled automatically from owner/repo -> used in the in-page share button.
          SHARE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # OPTIONAL for the demo: leave this secret UNSET to publish a public (unencrypted) sample.
          # (Set it only if you want the demo itself behind a throwaway passphrase.)
          PAGE_PASSPHRASE: ${{ secrets.PAGE_PASSPHRASE }}
        run: python -m cyberdigest.build --out public
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
